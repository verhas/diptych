name: Build

# Only by hand from the Actions tab, for now: GitHub's newest runner has
# Xcode 26, and Diptych needs 27 (see Choose Xcode). Put push and
# pull_request back once runs-on names a runner that has it.
on:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # NameSuggester uses LanguageModelError, which is only in macOS 27
      # SDK: the newest Xcode on the runner is chosen, and anything older than
      # 27 stops here with a clear message rather than a compile error.
      - name: Choose Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $xcode"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          major=$(xcodebuild -version | awk 'NR==1 { split($2, v, "."); print v[1] }')
          if [ "$major" -lt 27 ]; then
            echo "::error::Diptych needs Xcode 27 or later; the newest on this runner is $major."
            exit 1
          fi

      - name: Build (Release)
        run: CONFIG=Release ./build.sh build
